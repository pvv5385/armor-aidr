# Carried over from this org's own backend/app/guardrails/rulesets/secrets/
# rules.py (ALLOWLIST_STOPWORDS), which in turn came from this org's own
# infra/agentguard-mcp-scanner gitleaks configuration — a config file we
# wrote, in gitleaks' config format. Not gitleaks' shipped default stopword
# list, which is a generated wordlist orders of magnitude larger than this.
#
# Suppresses pagination tokens, API-spec examples, and test fixtures.
# A secrets match on a line containing any of these (substring match) is
# suppressed as a likely fixture/example rather than a real leaked secret.
- next_page_token
- page_token
- next_cursor
- continuation_token
- cursor
- page_cursor
- example
- examples
- x-example
- default
- schema
- openapi
- swagger
- placeholder
- YOUR_API_KEY
- YOUR_SECRET
- REPLACE_ME
- INSERT_KEY_HERE
- test_secret
- fake_key
- dummy
- mock
- fixture
- sample
- lorem
- base64_encoded
- encoded_data
- binary_data
- image/png
- image/jpeg
- data:image
