# Secrets ruleset — written from each vendor's own published token format,
# starting with the providers gitleaks documents as its defaults
# (aws/github/stripe/generic_api/jwt/private_key).
#
# Provider coverage was substantially expanded by cross-checking against
# llm-guard's `secrets_plugins/` for gaps in what providers were worth
# covering; the patterns below encode each vendor's own public specification
# (prefixes like `sk-ant-`, `ghp_`, `xoxb-` are the vendors' published token
# formats, not any guardrails project's invention). No pattern text was taken
# from that project. A prefix/shape match alone
# is treated as a hit;
# `require_entropy: true` additionally requires the matched text to clear a
# Shannon-entropy threshold (see `secrets.rs`) for patterns broad enough
# (bare 32-char hex, generic keyword+value) that shape alone isn't distinctive.
#
# This still isn't exhaustive — llm-guard's `secrets_plugins/` covers ~95
# providers total; the long tail not ported here (e.g. Adafruit, Algolia,
# Asana, Bittrex, Confluent, Flickr, Kucoin, Sidekiq, Zendesk) is a fine
# candidate for a future pass, cross-checked the same way.
- id: aws-access-key-id
  description: AWS Access Key ID
  provider: aws
  regex: '\b(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\b'
- id: aws-secret-access-key
  description: AWS Secret Access Key
  provider: aws
  case_insensitive: true
  regex: 'aws(?:.{0,20})?(?:secret|access)?_?key(?:.{0,20})?[\x22\x27]\s*[:=]\s*[\x22\x27][A-Za-z0-9/+=]{40}[\x22\x27]'
- id: aws-session-token
  description: AWS session token
  provider: aws
  case_insensitive: true
  regex: '(?:aws_session_token|AWS_SESSION_TOKEN)[\x22\x27\s:=]+[A-Za-z0-9+/=]{100,}'

- id: github-pat
  description: GitHub Personal Access Token (classic)
  provider: github
  regex: '\bghp_[A-Za-z0-9]{30,}\b'
- id: github-oauth
  description: GitHub OAuth Token
  provider: github
  regex: '\bgho_[A-Za-z0-9]{30,}\b'
- id: github-app-token
  description: GitHub App installation token
  provider: github
  regex: '\b(?:ghu|ghs)_[A-Za-z0-9]{30,}\b'
- id: github-refresh-token
  description: GitHub Refresh Token
  provider: github
  regex: '\bghr_[A-Za-z0-9]{30,}\b'
- id: github-pat-fine-grained
  description: GitHub fine-grained Personal Access Token
  provider: github
  regex: '\bgithub_pat_[A-Za-z0-9_]{22,}\b'

- id: stripe-live-secret-key
  description: Stripe live secret key
  provider: stripe
  regex: '\bsk_live_[A-Za-z0-9]{24,}\b'
- id: stripe-live-restricted-key
  description: Stripe live restricted key
  provider: stripe
  regex: '\brk_live_[A-Za-z0-9]{24,}\b'
- id: stripe-publishable-key
  description: Stripe publishable key
  provider: stripe
  regex: '\bpk_(?:live|test)_[A-Za-z0-9]{24,}\b'

- id: generic-api-key
  description: Generic API key (keyword + high-entropy value)
  provider: generic_api
  case_insensitive: true
  regex: '(?:api[_-]?key|apikey|access[_-]?token|secret)[\x22\x27]?\s*[:=]\s*[\x22\x27][0-9a-zA-Z\-_]{16,64}[\x22\x27]'

# Keyword-anchored fallback for custom/internal key formats no named
# vendor pattern above will ever enumerate — same idea as detect-secrets'
# Base64HighEntropyString/HexHighEntropyString plugins, scoped to an
# assignment shape (keyword = "value") rather than scanning bare text, to
# keep this usable as an opt-in provider without scanning every quoted
# string in a document. `require_entropy` here checks capture group 1 (the
# value only, not the keyword/quotes) — see secrets.rs's evaluate() — so a
# placeholder like `api_key = "your_key_here"` (low charset diversity)
# stays clean while a genuinely random key still trips it. Separate
# `generic_secret` provider from `generic-api-key`'s `generic_api` so
# enabling this broader/entropy-gated net is an explicit opt-in, not a
# silent behavior change to the existing rule.
- id: generic-high-entropy-secret
  description: Keyword-anchored high-entropy secret in an unrecognized/custom format
  provider: generic_secret
  case_insensitive: true
  require_entropy: true
  regex: '(?:api[_-]?key|apikey|access[_-]?token|secret[_-]?key|client[_-]?secret|auth[_-]?token|password|credential)[\x22\x27]?\s*[:=]\s*[\x22\x27]([0-9a-zA-Z\-_+/=]{20,100})[\x22\x27]'

- id: jwt
  description: JSON Web Token
  provider: jwt
  regex: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'

- id: private-key-block
  description: PEM private key block (all algorithms)
  provider: private_key
  regex: '-----BEGIN(?: RSA| EC| OPENSSH| DSA| PGP| ENCRYPTED)? PRIVATE KEY(?: BLOCK)?-----'

# ---------- LLM vendor keys ----------
- id: openai-key
  description: OpenAI API key
  provider: openai
  regex: '\bsk-[A-Za-z0-9_-]{20,}\b'
- id: anthropic-key
  description: Anthropic API key
  provider: anthropic
  regex: '\bsk-ant-[A-Za-z0-9_-]{20,}\b'
- id: azure-openai-key
  description: Azure key (32-char hex, entropy-gated to avoid matching arbitrary hex IDs)
  provider: azure
  require_entropy: true
  regex: '\b[A-Fa-f0-9]{32}\b'
- id: azure-storage-key
  description: Azure Storage account key (88-char base64, keyword-anchored)
  provider: azure
  case_insensitive: true
  regex: '(?:AZURE_STORAGE_KEY|StorageAccountKey|AccountKey)[:=\s\x22\x27]+[A-Za-z0-9+/]{86}=='
- id: google-api-key
  description: Google API key
  provider: google
  regex: '\bAIza[A-Za-z0-9_-]{35}\b'
- id: openrouter-key
  description: OpenRouter API key
  provider: openrouter
  regex: '\bsk-or-(?:v1-)?[A-Za-z0-9_-]{32,}\b'
- id: huggingface-token
  description: Hugging Face access token
  provider: huggingface
  regex: '\bhf_[A-Za-z0-9]{30,}\b'
- id: xai-key
  description: xAI API key
  provider: xai
  regex: '\bxai-[A-Za-z0-9]{60,}\b'
- id: mistral-key
  description: Mistral API key (keyword-anchored)
  provider: mistral
  case_insensitive: true
  regex: '(?:mistral[_-]?(?:api[_-]?)?key|MISTRAL_API_KEY)[\x22\x27\s:=]+[A-Za-z0-9]{32}\b'
- id: cohere-key
  description: Cohere API key (keyword-anchored)
  provider: cohere
  case_insensitive: true
  regex: '(?:cohere[_-]?(?:api[_-]?)?key|COHERE_API_KEY)[\x22\x27\s:=]+[A-Za-z0-9]{40}\b'
- id: replicate-token
  description: Replicate API token
  provider: replicate
  regex: '\br8_[A-Za-z0-9]{37,}\b'
- id: deepseek-key
  description: DeepSeek API key (keyword-anchored)
  provider: deepseek
  case_insensitive: true
  regex: '(?:deepseek[_-]?(?:api[_-]?)?key|DEEPSEEK_API_KEY)[\x22\x27\s:=]+[A-Za-z0-9]{32,}\b'
- id: groq-key
  description: Groq API key
  provider: groq
  regex: '\bgsk_[A-Za-z0-9]{48,}\b'

# ---------- Source control / issue trackers ----------
- id: npm-token
  description: npm access token
  provider: npm
  regex: '\bnpm_[A-Za-z0-9]{30,}\b'
- id: gitlab-pat
  description: GitLab personal access token
  provider: gitlab
  regex: '\bglpat-[A-Za-z0-9_-]{20}\b'
- id: gitlab-runner-token
  description: GitLab runner registration token
  provider: gitlab
  regex: '\bglrt-[A-Za-z0-9_-]{20}\b'
- id: linear-key
  description: Linear API key
  provider: linear
  regex: '\blin_(?:api|oauth)_[A-Za-z0-9]{40,}\b'
- id: notion-token
  description: Notion integration token
  provider: notion
  regex: '\bntn_[A-Za-z0-9]{40,}\b|\bsecret_[A-Za-z0-9]{43}\b'

# ---------- Payments / email / comms ----------
- id: twilio-account-sid
  description: Twilio Account SID
  provider: twilio
  regex: '\bAC[a-f0-9]{32}\b'
- id: twilio-auth-token
  description: Twilio auth token (keyword-anchored)
  provider: twilio
  case_insensitive: true
  regex: '(?:twilio[_-]?auth[_-]?token|TWILIO_AUTH_TOKEN)[\x22\x27\s:=]+[a-f0-9]{32}\b'
- id: twilio-api-key
  description: Twilio API key (distinct from the Account SID's AC prefix)
  provider: twilio
  regex: '\bSK[A-Za-z0-9]{28,34}\b'
- id: sendgrid-key
  description: SendGrid API key
  provider: sendgrid
  regex: '\bSG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{35,}\b'
- id: mailgun-key
  description: Mailgun private API key (keyword-anchored — bare key-[a-z0-9]{32} is a
    historically FP-prone shape, per gitleaks' own keyword-anchored revision of this pattern).
    The keyword gap allows up to 20 filler chars so a variable name like MAILGUN_SENDING_KEY
    still anchors, not just the literal MAILGUN_API_KEY.
  provider: mailgun
  case_insensitive: true
  regex: '\bmailgun[a-z0-9 _.-]{0,20}[\x22\x27\s:=]+key-[A-Za-z0-9]{32}\b'
- id: mailgun-pub-key
  description: Mailgun public validation key (pubkey-... — a distinct shape from the private
    API key above; gitleaks tracks it as its own rule, mailgun-pub-key)
  provider: mailgun
  case_insensitive: true
  regex: '\bmailgun[a-z0-9 _.-]{0,20}[\x22\x27\s:=]+pubkey-[A-Za-z0-9]{32}\b'
- id: mailgun-signing-key
  description: Mailgun webhook signing key (hex32-hex8-hex8 — no key-/pubkey- prefix at all,
    so this is unreachable from the two rules above; gitleaks tracks it separately as
    mailgun-signing-key)
  provider: mailgun
  case_insensitive: true
  regex: '\bmailgun[a-z0-9 _.-]{0,20}[\x22\x27\s:=]+[a-h0-9]{32}-[a-h0-9]{8}-[a-h0-9]{8}\b'
- id: mailchimp-key
  description: Mailchimp API key
  provider: mailchimp
  regex: '\b[0-9a-f]{32}-us[0-9]{1,2}\b'
- id: pagerduty-token
  description: PagerDuty API token (keyword-anchored)
  provider: pagerduty
  case_insensitive: true
  regex: '(?:pagerduty[_-]?(?:api[_-]?)?(?:token|key)|PAGERDUTY_API_TOKEN)[\x22\x27\s:=]+[A-Za-z0-9+/=_-]{20,}\b'
- id: slack-bot-token
  description: Slack bot token
  provider: slack
  regex: '\bxoxb-\d{9,}-\d{9,}-[A-Za-z0-9]{24,}\b'
- id: slack-user-token
  description: Slack user token
  provider: slack
  regex: '\bxoxp-\d{9,}-\d{9,}-\d{9,}-[A-Za-z0-9]{32,}\b'
- id: slack-admin-token
  description: Slack admin (org-wide) token
  provider: slack
  regex: '\bxoxa-[A-Za-z0-9-]{40,}\b'
- id: slack-refresh-token
  description: Slack refresh token
  provider: slack
  regex: '\bxoxr-[A-Za-z0-9-]{40,}\b'
- id: slack-webhook
  description: Slack incoming webhook URL
  provider: slack
  regex: '\bhttps://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{24}\b'
- id: discord-webhook
  description: Discord webhook URL
  provider: discord
  regex: '\bhttps://(?:discord|discordapp)\.com/api/webhooks/\d{17,19}/[A-Za-z0-9_-]{60,}\b'
- id: discord-bot-token
  description: Discord bot token
  provider: discord
  regex: '\b[MN][A-Za-z0-9_-]{23,}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,}\b'
- id: shopify-token
  description: Shopify access/custom-app token
  provider: shopify
  regex: '\bshp(?:at|ca|pa|ss)_[a-f0-9]{32}\b'
- id: digitalocean-token
  description: DigitalOcean personal access / OAuth token
  provider: digitalocean
  regex: '\bdo[a-z]{0,3}_v1_[a-f0-9]{64}\b'

# ---------- Observability / infra / vault ----------
- id: datadog-api-key
  description: Datadog API key (keyword-anchored)
  provider: datadog
  case_insensitive: true
  regex: '(?:datadog[_-]?api[_-]?key|DD_API_KEY|DATADOG_API_KEY)[\x22\x27\s:=]+[a-f0-9]{32}\b'
- id: datadog-app-key
  description: Datadog application key (keyword-anchored)
  provider: datadog
  case_insensitive: true
  regex: '(?:datadog[_-]?(?:app|application)[_-]?key|DD_APP_KEY|DATADOG_APP_KEY)[\x22\x27\s:=]+[a-f0-9]{40}\b'
- id: hashicorp-vault-token
  description: HashiCorp Vault service/batch token
  provider: hashicorp_vault
  regex: '\bhvs\.[A-Za-z0-9_-]{24,}\b|\bhvb\.[A-Za-z0-9_-]{24,}\b'
- id: doppler-token
  description: Doppler token
  provider: doppler
  regex: '\bdp\.(?:st|ct|pt|sa)\.(?:[A-Za-z0-9_-]+\.)?[A-Za-z0-9_-]{40,}\b'
- id: vercel-token
  description: Vercel API token (keyword-anchored)
  provider: vercel
  case_insensitive: true
  regex: '(?:vercel[_-]?(?:api[_-]?)?token|VERCEL_TOKEN)[\x22\x27\s:=]+[A-Za-z0-9]{24}\b'
- id: heroku-api-key
  description: Heroku API key (keyword-anchored)
  provider: heroku
  case_insensitive: true
  regex: '(?:heroku[_-]?api[_-]?key|HEROKU_API_KEY)[\x22\x27\s:=]+[a-f0-9-]{36}\b'
- id: cloudflare-api-token
  description: Cloudflare API token (keyword-anchored)
  provider: cloudflare
  case_insensitive: true
  regex: '(?:cloudflare[_-]?(?:api[_-]?)?token|CF_API_TOKEN)[\x22\x27\s:=]+[A-Za-z0-9_-]{40}\b'

# ---------- Databases ----------
- id: postgres-connection-string
  description: PostgreSQL connection string with embedded credentials
  provider: postgres
  case_insensitive: true
  regex: 'postgres(?:ql)?://[^\s:/@]+:[^\s@]+@[^\s]+'
- id: mongodb-connection-string
  description: MongoDB connection string with embedded credentials
  provider: mongodb
  case_insensitive: true
  regex: 'mongodb(?:\+srv)?://[^\s:/@]+:[^\s@]+@[^\s]+'
- id: mysql-connection-string
  description: MySQL connection string with embedded credentials
  provider: mysql
  case_insensitive: true
  regex: 'mysql://[^\s:/@]+:[^\s@]+@[^\s]+'

# ---------- Cloud (Azure / GCP) ----------
- id: azure-connection-string
  description: Azure connection string (AccountKey/SharedAccessKey/SharedAccessSignature)
  provider: azure
  case_insensitive: true
  regex: '(?:SharedAccessSignature|SharedAccessKey|AccountKey)\s*=\s*[A-Za-z0-9+/=]{20,}'
- id: azure-sas
  description: Azure SAS token URL parameter (sv=...&...sig=...)
  provider: azure
  regex: '\?sv=\d{4}-\d{2}-\d{2}&[^\s]*?sig=[A-Za-z0-9%]{40,}'
- id: gcp-service-account
  description: GCP service account JSON key (type + embedded PEM private key)
  provider: gcp
  regex: '\x22type\x22\s*:\s*\x22service_account\x22(?s:.*?)\x22private_key\x22\s*:\s*\x22-----BEGIN(?:[^\x22]*?)PRIVATE KEY-----'
