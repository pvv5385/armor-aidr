# Baseline set of widely-recognized brand domains used as the comparison
# target for homoglyph/typosquat detection — a link to a *visually similar*
# domain (not this exact one) is the phishing tell. Deployments can extend
# this via the malicious_url check's `popular_domains` option; this list is
# a starting default, not a claim of completeness. Alphabetized.
