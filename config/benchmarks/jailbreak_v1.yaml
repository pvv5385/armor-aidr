# Jailbreak benchmark corpus v1 - labelled samples for every pattern shipped
# in rules/jailbreak/rules.yaml (persona/framing/ethics-bypass/obfuscation
# mechanism categories; harmful-content-topic patterns are out of scope,
# see that file's header).
#
# Coverage target:
#   3+ positive samples per shipped rule.
#   3+ near-miss negatives per shipped rule, PLUS a general_benign section
#   of realistic non-adversarial prompts targeting the categories most
#   likely to over-fire (fictional_framing, ethics_bypass_declaration,
#   jailbreak_keyword) — these are the ones that share vocabulary with
#   everyday creative-writing, research, and IT-support requests.
#
# Acceptance criteria (see crates/core/tests/jailbreak_benchmark.rs, which
# is the actual runner — a benchmark corpus with no runner behind it is
# documentation, not evaluation):
#   recall >= 0.95 overall (every positive sample must fire its rule_id;
#     these are literal patterns written from these exact phrasings, so
#     100% is the expectation, not just the bar).
#   false-positive rate <= 0.02 for persona_override / obfuscated_bypass /
#     jailbreak_keyword's compromise-declaration rule specifically — low
#     enough these could be considered for `mode: block` promotion.
#   false-positive rate is REPORTED, not gated, for fictional_framing /
#     ethics_bypass_declaration / jailbreak-keyword-mention — these are
#     expected to be chattier (see rules/jailbreak/rules.yaml's header);
#     that expected higher rate is exactly why the category ships
#     `mode: warn`, not `block`, in config/policies.yaml.
#
# Run via: crates/core/tests/jailbreak_benchmark.rs (cargo test -p armor-core
# --test jailbreak_benchmark)

dataset_name: jailbreak-v1
version: 1
created: 2026-07-29

# =================================================================
