# Malicious-URL benchmark corpus v1.
# One positive/negative pair per detection mechanism (shortener,
# suspicious TLD, excessive subdomains, homoglyphs, typosquats, etc.). See
# crates/core/tests/malicious_url_benchmark.rs for implementation details.

dataset_name: malicious-url-v1
version: 1
created: 2026-07-30

positive_samples:
  - { id: url-ip-literal-host-1, rule_id: url-ip-literal-host, text: "click http://203.0.113.5/login" }
  - { id: url-ip-literal-host-2, rule_id: url-ip-literal-host, text: "visit http://198.51.100.7/verify" }
  - { id: url-punycode-host-1, rule_id: url-punycode-host, text: "visit https://xn--pple-43d.com/verify" }
