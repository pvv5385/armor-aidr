  - { id: n-url-ip-literal-host-2, rule_ids: [url-ip-literal-host], text: "check https://api.service.io/v1/users" }
  - { id: n-url-punycode-host-1, rule_ids: [url-punycode-host], text: "visit https://example.com/page" }
  - { id: n-url-punycode-host-2, rule_ids: [url-punycode-host], text: "check https://normal-domain.org/info" }
  - { id: n-url-credentials-in-authority-1, rule_ids: [url-credentials-in-authority], text: "visit https://example.com/page" }
