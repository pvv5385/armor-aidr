  - { id: url-credentials-in-authority-2, rule_id: url-credentials-in-authority, text: "go to https://support.microsoft.com@phish.example/verify" }
  - { id: url-known-shortener-1, rule_id: url-known-shortener, text: "see https://bit.ly/3abcXyz for details" }
