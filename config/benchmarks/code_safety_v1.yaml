# Code-safety benchmark corpus v1.
# Labelled samples cover the patterns defined in rules/code_safety/rules.yaml.
# Positive and negative code examples are wrapped in fenced code blocks (```)
# because the detector scans block content only. This file follows the same
# coverage and acceptance conventions as exfiltration_v1.yaml. See
# crates/core/tests/code_safety_benchmark.rs for implementation details.

dataset_name: code-safety-v1
version: 1
created: 2026-07-30

