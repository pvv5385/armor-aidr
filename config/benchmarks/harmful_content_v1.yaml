# Harmful-content benchmark corpus v1 - labelled samples for every pattern
# shipped in rules/harmful_content/rules.yaml (weapons/drugs/violence/csam
# content-topic categories; jailbreak *mechanism* patterns are out of
# scope, see rules/jailbreak/rules.yaml).
#
# Coverage target (same convention as jailbreak_v1.yaml):
#   3+ positive samples per shipped rule.
#   3+ near-miss negatives per shipped rule, PLUS a general_benign section
#   of realistic non-adversarial prompts (news, policy, fiction, medical/
#   legal research, trust-and-safety discussion) targeting the topics most
#   likely to over-fire.
#
# Acceptance criteria (see crates/core/tests/harmful_content_benchmark.rs,
# which is the actual runner — a benchmark corpus with no runner behind it
# is documentation, not evaluation):
#   recall >= 0.95 overall (every positive sample must fire its rule_id;
#     these are literal patterns written from these exact phrasings, so
#     100% is the expectation, not just the bar).
#   false-positive rate <= 0.02 for weapons_howto / drugs_howto /
#     violence_howto's near-miss negatives specifically — each of those
#     rules requires an instructional verb phrase ("how to <verb> a <harmful
#     noun>") plus a completion clause, which is uncommon enough in benign
#     text that these are candidates for `mode: block` promotion once the
#     engine gains per-rule mode granularity.
#   false-positive rate is REPORTED, not gated, for csam-material-mention
#     specifically — bare mentions of "child sexual abuse material"/"child
#     pornography" are common in legitimate news, legal, and prevention/
#     trust-and-safety discourse (see the n-csam-material-mention-2 sample
#     below), and that's exactly why the category ships `mode: warn`, not
#     `block` — a flag on a false positive here costs a review, not a
#     denied legitimate request, while a false negative costs a missed
#     solicitation.
#
# Run via: crates/core/tests/harmful_content_benchmark.rs (cargo test -p
# armor-core --test harmful_content_benchmark)

dataset_name: harmful-content-v1
version: 1
created: 2026-07-29

