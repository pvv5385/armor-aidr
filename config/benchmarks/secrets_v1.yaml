  - { id: mailgun-key-2, rule_id: mailgun-key, text: "leaked: mailgun_api_key: key-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" }
  - { id: mailgun-key-3, rule_id: mailgun-key, text: "leaked: MAILGUN_SENDING_KEY=key-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee" }
  - { id: mailgun-pub-key-1, rule_id: mailgun-pub-key, text: "leaked: MAILGUN_PUBLIC_KEY=pubkey-dddddddddddddddddddddddddddddddd" }
  - { id: mailgun-pub-key-2, rule_id: mailgun-pub-key, text: "leaked: mailgun_pub_key: pubkey-ffffffffffffffffffffffffffffffff" }
  - { id: mailgun-signing-key-1, rule_id: mailgun-signing-key, text: "leaked: MAILGUN_SIGNING_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-bbbbbbbb-cccccccc" }
  - { id: mailgun-signing-key-2, rule_id: mailgun-signing-key, text: "leaked: mailgun webhook signing key: deadbeefdeadbeefdeadbeefdeadbeef-01234567-89abcdef" }
