  # Digits deliberately non-repeating: the original "111111111-222222222"
  # placeholder, concatenated, happened to pass the Luhn checksum, so armor's
  # orchestrator matched `pci` (mode: block) first and never reached
  # `secrets` for this sample at all — an early-block short-circuit, not a
  # regex or detection gap. This shape still matches slack-bot-token's
  # `\bxoxb-\d{9,}-\d{9,}-[A-Za-z0-9]{24,}\b` pattern without the
  # coincidental PCI collision.
  - { id: slack-bot-token-1, rule_id: slack-bot-token, text: "leaked: xoxb-102938475-564738291-AAAAAAAAAAAAAAAAAAAAAAAAAA" }
  - { id: slack-bot-token-2, rule_id: slack-bot-token, text: "leaked: xoxb-333333333-444444444-BBBBBBBBBBBBBBBBBBBBBBBB" }
