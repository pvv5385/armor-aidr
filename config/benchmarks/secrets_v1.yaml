# Secrets benchmark corpus v1.
# Representative set of provider patterns for secrets detection (not
# exhaustive). This corpus covers a representative slice of provider
# families; see crates/core/tests/secrets_benchmark.rs for implementation
# and coverage details.

dataset_name: secrets-v1
version: 1
created: 2026-07-30

providers_covered: [aws, github, stripe, jwt, private_key, openai, anthropic, google, huggingface, replicate, groq, npm, gitlab, twilio, slack, sendgrid, mailgun, azure, generic_secret]

