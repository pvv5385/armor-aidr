# PII benchmark corpus v1 - REPRESENTATIVE, not exhaustive. The ruleset
# ships ~66 entity patterns (rules/pii/rules.yaml); this corpus covers 12
# spanning the no-validator, context-excluded, and checksum-free entity
# shapes: email, phone (context_exclude), ssn (context_exclude), ipv4
# (private-IP skip logic), iban, mac address, ethereum address, passport,
# vin, in-upi (context_exclude_after), uk vat, medical record number.
# Checksum-validated entities (br_cpf, au_acn, in_aadhaar, uk_nhs, etc.) are
# already covered by dedicated inline unit tests in
# crates/core/src/detectors/pii.rs (valid-checksum-denies /
# invalid-checksum-allows pairs per entity) rather than duplicated here.
# See crates/core/tests/pii_benchmark.rs.

dataset_name: pii-v1
version: 1
created: 2026-07-30

entities_covered: [email, phone, ssn, ip_address, iban, mac_address, ethereum_address, passport, vin, in_upi, uk_vat, medical_record]

